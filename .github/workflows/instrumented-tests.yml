name: Instrumented Tests

on:
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      test_class:
        description: 'Specific test class to run (leave empty for all)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  instrumented-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The runner waits this long for the emulator to exit gracefully before killing it.
      # Trimmed from the default 20s so a shutdown that stalls costs seconds, not minutes.
      # (It is not what stranded this job at 30 minutes -- see the -no-snapshot-load note
      # below for that -- but there is no reason to sit through the longer default.)
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api29-x86_64-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            avd-api29-x86_64-

      # No separate "Create AVD and generate snapshot" step. The step below boots with
      # -no-snapshot-load -no-snapshot-save, so a saved snapshot was never used, and the step
      # that made one only ran on an AVD cache miss -- where it either hung in the runner's
      # teardown or, restored from a partial-key match, booted a stale snapshot into a
      # DeadSystemException. On a miss the emulator action creates the AVD itself
      # (force-avd-creation: false), and the post step caches it as before.
      - name: Run Instrumented Tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TEST_CLASS: ${{ github.event.inputs.test_class }}
        with:
          api-level: 29
          arch: x86_64
          force-avd-creation: false
          # -no-snapshot-load forces a real boot. Restoring the cached snapshot resumes in
          # ~1.5s, so sys.boot_completed reads 1 off restored state while `settings`, `input`
          # and the rest are still publishing -- and the action's only readiness gate is that
          # one property, after which it fires `input keyevent 82` and dies with "No service
          # published for: input". The AVD cache still saves image setup; only the resume goes.
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Unlock and animation-disabling move into the script, behind a readiness wait.
          disable-animations: false
          script: |
            bash scripts/ci-await-emulator.sh
            adb uninstall com.mtbanalyzer || true
            adb uninstall com.mtbanalyzer.test || true
            adb logcat -c
            ./gradlew connectedDebugAndroidTest ${TEST_CLASS:+-Pandroid.testInstrumentationRunnerArguments.class=$TEST_CLASS}
            rc=$?
            adb logcat -d '*:E' > logcat_errors.txt
            adb logcat -d DetectionTuning:* DETECTION_TUNING:* AndroidRuntime:* > logcat_app.txt
            bash scripts/ci-stop-emulator.sh
            exit $rc

      - name: Upload Logcat
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logcat-output
          path: |
            logcat_errors.txt
            logcat_app.txt
          retention-days: 7

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-results
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 7

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: '**/build/outputs/androidTest-results/**/*.xml'
          comment_mode: 'off'
          check_name: 'Instrumented Test Results'
